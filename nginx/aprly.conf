server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/xml
        font/woff2;

    # ── security headers ───────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                always;
    add_header X-Content-Type-Options   "nosniff"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "0"                         always;

    # ── static root ────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Hash-named static assets are immutable — long cache + skip access log.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest and favicons get short cache.
    location ~* \.(?:manifest\.webmanifest|webmanifest|svg|ico|png)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ── API reverse proxy ──────────────────────────────────────────────
    # Express mounts every route under /api/*, so we keep the /api/ prefix
    # when forwarding (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://api-server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        client_max_body_size 50m;
    }

    # ── SPA fallback ───────────────────────────────────────────────────
    # Any non-asset, non-API path returns index.html so client-side routing
    # (wouter) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
