# Port 80: dev hostname — ACME HTTP-01 + redirect to HTTPS.
server {
    listen 80;
    server_name dev.aprly.ai;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://dev.aprly.ai$request_uri;
    }
}

# Port 80: default — SPA + API (legacy http://<IP>/).
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/xml
        font/woff2;

    add_header X-Frame-Options          "SAMEORIGIN"                always;
    add_header X-Content-Type-Options   "nosniff"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "0"                         always;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:manifest\.webmanifest|webmanifest|svg|ico|png)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api-server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        client_max_body_size 50m;
    }

    include /etc/nginx/conf.d/aprly-spa-locations.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — canonical public URL (dev.aprly.ai).
server {
    listen 443 ssl http2;
    server_name dev.aprly.ai;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
