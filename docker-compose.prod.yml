# Production stack for APRly on the DigitalOcean droplet.
#
# Reads variables from .env.prod (see deploy/README.md). Only nginx (in the
# `frontend` service) is published on the host; db and api-server stay on the
# internal docker network.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile ops run --rm db-migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile ops run --rm db-seed

name: aprly-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - aprly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aprly-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://dev.aprly.ai}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SEC: ${JWT_ACCESS_TTL_SEC:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SANDBOX_SETUP_FEE_PRODUCT_ID: ${STRIPE_SANDBOX_SETUP_FEE_PRODUCT_ID:-}
      STRIPE_SANDBOX_SETUP_FEE_PRICE_ID: ${STRIPE_SANDBOX_SETUP_FEE_PRICE_ID:-}
      STRIPE_SANDBOX_SUBSCRIPTION_PRODUCT_ID: ${STRIPE_SANDBOX_SUBSCRIPTION_PRODUCT_ID:-}
      STRIPE_SANDBOX_SUBSCRIPTION_PRICE_ID: ${STRIPE_SANDBOX_SUBSCRIPTION_PRICE_ID:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: aprly-frontend:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ACME HTTP-01 webroot (host). Certbot on the droplet: -w /var/www/aprly/certbot-www
      - /var/www/aprly/certbot-www:/var/www/certbot:ro
      # TLS PEMs: copy real certs here after certbot (see deploy/README.md), or leave
      # empty — entrypoint generates a short-lived self-signed pair so nginx can bind :443.
      - /var/www/aprly/nginx-ssl:/etc/nginx/ssl:rw
    depends_on:
      api-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── one-shot ops services (only run with `--profile ops`) ──────────────────
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: aprly-migrate:local
    profiles: ["ops"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]

  db-seed:
    image: aprly-migrate:local
    profiles: ["ops"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-super.admin@aprly.ai}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: "no"
    command: ["pnpm", "--filter", "@workspace/db", "run", "seed"]

volumes:
  aprly-pgdata:
    name: aprly-pgdata
