openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: APRly API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: leads
  - name: optimizer
  - name: plaid
  - name: stripe
  - name: auth
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a lead (name, email, total debt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadInput"
      responses:
        "200":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /optimizer/calculate:
    post:
      operationId: calculateOptimization
      tags: [optimizer]
      summary: Calculate debt interest savings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizerInput"
      responses:
        "200":
          description: Optimizer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizerResult"

  /plaid/link-token:
    post:
      operationId: createPlaidLinkToken
      tags: [plaid]
      summary: Create a Plaid Link sandbox token
      responses:
        "200":
          description: Link token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidLinkToken"

  /plaid/exchange:
    post:
      operationId: exchangePlaidPublicToken
      tags: [plaid]
      summary: Exchange a public token for an access token (sandbox-simulated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaidExchangeInput"
      responses:
        "200":
          description: Linked account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaidLinkedAccount"

  /stripe/subscribe:
    post:
      operationId: createSubscription
      tags: [stripe]
      summary: Create a simulated Stripe subscription for the Interest Protection Plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "200":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard data — credit score, rate reductions, hardship status
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /dashboard/tab:
    get:
      operationId: getDashboardTab
      tags: [dashboard]
      summary: Dashboard tab context — subscription state and whether the user has leads
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tab context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTabContext"
        "401":
          description: Unauthorized

  /auth/register-and-checkout:
    post:
      operationId: registerAndCheckout
      tags: [auth]
      summary: Validate signup, store pending registration, create Stripe Checkout (subscription + setup fee + trial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAndCheckoutInput"
      responses:
        "200":
          description: Open Checkout in a new tab using checkoutUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAndCheckoutPayload"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsResponse"
        "503":
          description: Stripe is not configured

  /auth/checkout/session-status:
    get:
      operationId: getCheckoutSessionStatus
      tags: [auth]
      summary: Poll checkout completion; issues session cookies when payment is confirmed and the user exists
      parameters:
        - name: stripeSessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current checkout / auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionStatusResponse"
        "404":
          description: Unknown session

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email and password login; sets HTTP-only cookies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke refresh token and clear cookies
      responses:
        "204":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate refresh token and re-issue access cookie
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid refresh token

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

    patch:
      operationId: patchMe
      tags: [auth]
      summary: Update first and last name after checkout
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

    delete:
      operationId: deleteMe
      tags: [auth]
      summary: Delete the authenticated user account
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Account deleted
        "401":
          description: Unauthorized

  /auth/me/password:
    patch:
      operationId: patchMePassword
      tags: [auth]
      summary: Change password for the authenticated user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMePasswordInput"
      responses:
        "204":
          description: Password updated
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsResponse"
        "401":
          description: Unauthorized

  /me/cards/import:
    post:
      operationId: importMyCards
      tags: [me]
      summary: Import optimizer calculator cards for the authenticated user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCardsInput"
      responses:
        "200":
          description: Cards imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCardsResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /me/detailed-plan:
    post:
      operationId: createDetailedPlan
      tags: [me]
      summary: Import cabinet cards and create plan leads from optimizer calculation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCardsInput"
      responses:
        "200":
          description: Plan leads created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDetailedPlanResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /me/partners:
    get:
      operationId: getPartners
      tags: [me]
      summary: List partners available for plan lead submission
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Partner list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerListResponse"
        "401":
          description: Unauthorized

  /me/plan-leads/{id}:
    get:
      operationId: getPlanLead
      tags: [me]
      summary: Get plan lead detail with partner and hardship portal
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Plan lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanLeadDetail"
        "401":
          description: Unauthorized
        "404":
          description: Plan lead not found

    patch:
      operationId: updatePlanLeadStatus
      tags: [me]
      summary: Update plan lead lifecycle status
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanLeadStatusInput"
      responses:
        "200":
          description: Updated plan lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanLead"
        "400":
          description: Invalid status transition
        "401":
          description: Unauthorized
        "404":
          description: Plan lead not found

  /me/plan-leads/{id}/send:
    post:
      operationId: sendPlanLead
      tags: [me]
      summary: Send plan lead to partner (simulated v1)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPlanLeadInput"
      responses:
        "200":
          description: Plan lead sent to partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanLeadDetail"
        "400":
          description: Invalid request or status
        "401":
          description: Unauthorized
        "404":
          description: Plan lead or partner not found

  /me/subscription/checkout:
    post:
      operationId: createSubscriptionCheckout
      tags: [me]
      summary: Start Stripe Checkout for subscription renewal (subscription only, no setup fee)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckoutPayload"
        "401":
          description: Unauthorized
        "503":
          description: Stripe is not configured

  /me/subscription/session-status:
    get:
      operationId: getSubscriptionCheckoutSessionStatus
      tags: [me]
      summary: Poll subscription checkout; updates user subscription when paid
      security:
        - cookieAuth: []
      parameters:
        - name: stripeSessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckoutStatusResponse"
        "401":
          description: Unauthorized
        "403":
          description: Session does not belong to this user
        "404":
          description: Unknown session

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aprly_access
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CreateLeadInput:
      type: object
      required: [name, email, totalDebt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        totalDebt:
          type: number
          minimum: 0
          maximum: 100000000
        interestRate:
          type: number
          minimum: 0
          maximum: 100

    Lead:
      type: object
      required: [id, name, email, totalDebt, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        totalDebt:
          type: number
        interestRate:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time

    OptimizerInput:
      type: object
      required: [totalDebt, interestRate]
      properties:
        totalDebt:
          type: number
          minimum: 0
        interestRate:
          type: number
          minimum: 0
          description: Current APR as a percent (e.g. 24.99)
        targetRate:
          type: number
          minimum: 0
          default: 2
          description: Target APR after optimization (default 2%)
        monthlyPayment:
          type: number
          minimum: 0
          nullable: true

    OptimizerResult:
      type: object
      required:
        - dailyInterestWaste
        - monthlyInterestWaste
        - monthlySavings
        - annualSavings
        - currentPayoffMonths
        - newPayoffMonths
        - newPayoffDate
        - currentRate
        - targetRate
      properties:
        dailyInterestWaste:
          type: number
        monthlyInterestWaste:
          type: number
        monthlySavings:
          type: number
        annualSavings:
          type: number
        currentPayoffMonths:
          type: integer
        newPayoffMonths:
          type: integer
        newPayoffDate:
          type: string
          format: date
        currentRate:
          type: number
        targetRate:
          type: number

    PlaidLinkToken:
      type: object
      required: [linkToken, expiration, sandbox]
      properties:
        linkToken:
          type: string
        expiration:
          type: string
          format: date-time
        sandbox:
          type: boolean

    PlaidExchangeInput:
      type: object
      required: [publicToken]
      properties:
        publicToken:
          type: string
        institutionName:
          type: string

    PlaidImportedCard:
      type: object
      required: [brand, balance, rate]
      properties:
        brand:
          type: string
        balance:
          type: number
          minimum: 0
        rate:
          type: number
          minimum: 0
          description: Current APR as a percent (e.g. 24.99)
        accountId:
          type: string
          description: Plaid account_id for deduplication on the client

    PlaidLinkedAccount:
      type: object
      required: [itemId, institutionName, mask, accountType, importedCards]
      properties:
        itemId:
          type: string
        institutionName:
          type: string
        mask:
          type: string
        accountType:
          type: string
        importedCards:
          type: array
          items:
            $ref: "#/components/schemas/PlaidImportedCard"

    SubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        plan:
          type: string
          default: interest-protection-monthly

    Subscription:
      type: object
      required: [id, status, plan, amount, currency, currentPeriodEnd]
      properties:
        id:
          type: string
        status:
          type: string
        plan:
          type: string
        amount:
          type: number
        currency:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time

    DashboardSummary:
      type: object
      required:
        - creditScore
        - creditScoreDelta
        - creditScoreBand
        - rateReductions
        - hardshipPortal
        - linkedAccounts
        - totalDebt
        - estimatedAnnualSavings
      properties:
        creditScore:
          type: integer
        creditScoreDelta:
          type: integer
        creditScoreBand:
          type: string
        rateReductions:
          type: array
          items:
            $ref: "#/components/schemas/RateReduction"
        hardshipPortal:
          $ref: "#/components/schemas/HardshipPortal"
        linkedAccounts:
          type: array
          items:
            $ref: "#/components/schemas/LinkedAccountSummary"
        totalDebt:
          type: number
        estimatedAnnualSavings:
          type: number

    RateReduction:
      type: object
      required: [id, lender, currentApr, targetApr, estimatedSavings, status]
      properties:
        id:
          type: string
        lender:
          type: string
        currentApr:
          type: number
        targetApr:
          type: number
        estimatedSavings:
          type: number
        status:
          type: string
          enum: [recommended, in_progress, won, denied]

    HardshipPortal:
      type: object
      required: [stage, progress, steps, etaDays]
      properties:
        stage:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        etaDays:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/HardshipStep"

    HardshipStep:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [done, active, pending]
        description:
          type: string
        cta:
          type: string

    LinkedAccountSummary:
      type: object
      required: [institutionName, mask, balance, apr]
      properties:
        institutionName:
          type: string
        mask:
          type: string
        balance:
          type: number
        apr:
          type: number

    ImportCardItem:
      type: object
      required: [brand, balance, rate]
      properties:
        brand:
          type: string
          minLength: 1
        balance:
          type: number
          minimum: 0
        rate:
          type: number
          minimum: 0
          maximum: 100
        accountId:
          type: string
        source:
          type: string
          enum: [manual, plaid]

    ImportCardsInput:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImportCardItem"

    ImportCardsResponse:
      type: object
      required: [importedCount]
      properties:
        importedCount:
          type: integer
          minimum: 0

    PlanLeadStatus:
      type: string
      enum: [recommended, in_progress, won, denied]

    PlanLead:
      type: object
      required:
        - id
        - brand
        - balance
        - currentApr
        - targetApr
        - estimatedAnnualSavings
        - status
        - createdAt
      properties:
        id:
          type: integer
        brand:
          type: string
        balance:
          type: number
        currentApr:
          type: number
        targetApr:
          type: number
        estimatedAnnualSavings:
          type: number
        status:
          $ref: "#/components/schemas/PlanLeadStatus"
        createdAt:
          type: string
          format: date-time

    DashboardPlansSummary:
      type: object
      required: [totalDebt, estimatedAnnualSavings]
      properties:
        totalDebt:
          type: number
        estimatedAnnualSavings:
          type: number

    CreateDetailedPlanResponse:
      type: object
      required: [createdCount, plans]
      properties:
        createdCount:
          type: integer
          minimum: 0
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanLead"

    UpdatePlanLeadStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PlanLeadStatus"

    Partner:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    PartnerListResponse:
      type: object
      required: [partners]
      properties:
        partners:
          type: array
          items:
            $ref: "#/components/schemas/Partner"

    SendPlanLeadInput:
      type: object
      required: [partnerId]
      properties:
        partnerId:
          type: integer
          minimum: 1

    PlanLeadDetail:
      type: object
      required:
        - id
        - brand
        - balance
        - currentApr
        - targetApr
        - estimatedAnnualSavings
        - status
        - createdAt
      properties:
        id:
          type: integer
        brand:
          type: string
        balance:
          type: number
        currentApr:
          type: number
        targetApr:
          type: number
        estimatedAnnualSavings:
          type: number
        status:
          $ref: "#/components/schemas/PlanLeadStatus"
        createdAt:
          type: string
          format: date-time
        partnerId:
          type: integer
          nullable: true
        sentToPartnerAt:
          type: string
          format: date-time
          nullable: true
        partner:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Partner"
        hardshipPortal:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HardshipPortal"

    DashboardTabContext:
      type: object
      required: [subscriptionActive, hasLeads, plans, summary]
      properties:
        subscriptionActive:
          type: boolean
          description: True when Stripe subscription is active or trialing
        hasLeads:
          type: boolean
          description: True when the user has at least one plan lead
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanLead"
        summary:
          $ref: "#/components/schemas/DashboardPlansSummary"

    SubscriptionCheckoutPayload:
      type: object
      required: [checkoutUrl, stripeSessionId]
      properties:
        checkoutUrl:
          type: string
          format: uri
        stripeSessionId:
          type: string

    SubscriptionCheckoutStatusResponse:
      type: object
      required: [status, subscriptionActive]
      properties:
        status:
          type: string
          enum: [pending, processing, paid, failed, expired]
        subscriptionActive:
          type: boolean

    RegisterAndCheckoutInput:
      type: object
      required: [email, password, confirmPassword, termsAccepted]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 20
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 20
        termsAccepted:
          type: boolean

    RegisterAndCheckoutPayload:
      type: object
      required: [checkoutUrl, stripeSessionId]
      properties:
        checkoutUrl:
          type: string
          format: uri
        stripeSessionId:
          type: string

    CheckoutSessionStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, paid, failed, expired]
        user:
          nullable: true
          $ref: "#/components/schemas/AuthUserSummary"

    AuthUserSummary:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200

    MeResponse:
      type: object
      required: [id, email, role, hasActiveSubscription]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          type: string
        hasActiveSubscription:
          type: boolean
          description: True when the user has an active Stripe subscription on file

    PatchMeInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120

    PatchMePasswordInput:
      type: object
      required: [password, confirmPassword]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 20
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 20

    FieldErrorsResponse:
      type: object
      required: [fieldErrors]
      properties:
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
