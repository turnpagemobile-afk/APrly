services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aprly
    ports:
      - "5433:5432"
    volumes:
      # Without this, `docker compose down` / recreate `db` wipes all users and data.
      - aprly-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aprly"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bind-mount .:/app приховує node_modules з образу; анонімний том /app/node_modules часто
  # стає порожнім. Один раз ставимо залежності в спільний том перед app-сервісами.
  install-deps:
    # Образ node:arm64 + overrides у pnpm-workspace.yaml відрізають @rollup/linux-arm64-*;
    # залишено лише linux-x64 (Replit). amd64 у контейнері відповідає lockfile.
    platform: linux/amd64
    build:
      context: .
    environment:
      # pnpm інакше перериває зміну node_modules без TTY (Docker / CI)
      CI: "true"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    command: ["pnpm", "install", "--frozen-lockfile"]
    restart: "no"

  # Apply lib/db SQL migrations (users, registration_intents, refresh_tokens, …).
  # Without this, Postgres is empty and auth routes fail with "relation users does not exist".
  db-migrate:
    platform: linux/amd64
    build:
      context: .
    environment:
      CI: "true"
      DATABASE_URL: postgres://user:password@db:5432/aprly
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]
    depends_on:
      install-deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"

  api-server:
    platform: linux/amd64
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/aprly
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_ORIGIN=http://localhost:5173
      # Do not set STRIPE_* here with ${VAR:-}. An empty string from compose substitution counts as
      # "set" and prevents dotenv (and mounted .env) from filling secrets — register-and-checkout then
      # sees missing keys. Stripe + price IDs must come from env_file (.env) only.
      - AI_INTEGRATIONS_OPENAI_BASE_URL=${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - AI_INTEGRATIONS_OPENAI_API_KEY=${AI_INTEGRATIONS_OPENAI_API_KEY:-docker-dev-placeholder}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
      - JWT_ACCESS_TTL_SEC=${JWT_ACCESS_TTL_SEC:-900}
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "5000:5000"
    depends_on:
      install-deps:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    # Використовуємо --bundle або прямий запуск через tsx, якщо доступно
    command: pnpm --filter @workspace/api-server run dev

  frontend:
    platform: linux/amd64
    build:
      context: .
    environment:
      - VITE_API_PROXY_TARGET=http://api-server:5000
      - PORT=5173
      - BASE_PATH=/
    ports:
      - "5173:5173"
    depends_on:
      install-deps:
        condition: service_completed_successfully
      api-server:
        condition: service_started
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    # Скрипт dev у aprly вже містить --host 0.0.0.0; зайвий --host ламав аргументи vite
    command: pnpm --filter @workspace/aprly run dev

volumes:
  app-node-modules:
  aprly-pgdata-dev: