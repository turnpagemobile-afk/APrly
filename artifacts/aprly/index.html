      content="APrly is the wealth cockpit that hunts down credit card and personal-loan interest — and gives it back. Verify your savings in three steps."
    />
    <link rel="canonical" href="https://dev.aprly.ai/" />
    <meta name="theme-color" content="#151619" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="APrly — Stop feeding the banks. Crush your interest rate." />
    <meta
      property="og:description"
      content="APrly is the wealth cockpit that hunts down credit card and personal-loan interest — and gives it back. Verify your savings in three steps."
    />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="APrly is the wealth cockpit that hunts down credit card and personal-loan interest — and gives it back."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Display:wght@800;900&display=swap" rel="stylesheet">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "APrly.ai",
        "operatingSystem": "Web",
        "applicationCategory": "FinanceApplication",
        "featureList": [
          "Plaid Identity Verification",
          "Financial Liabilities Tracking",
          "MMI Packet Verification"
        ],
        "offers": {
          "@type": "Offer",
          "price": "39.00",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "39.00",
            "priceCurrency": "USD",
            "billingDuration": "P1M",
            "billingIncrement": 1,
            "unitCode": "MON"
          }
        }
      }
    </script>
    <script>
      (function () {
        var p = location.pathname;
        var landing =
          p === "/" || p === "/login" || p === "/privacy" || p === "/terms";
        if (landing) {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Local dev (vite.mono.config): all routes. Production landing build uses index.landing.html -->
    <script type="module" src="/src/apps/mono/main.tsx"></script>
  </body>
</html>
